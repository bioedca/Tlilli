# Codecov (PR-CI-011, PR-TST-011, D-023, PRD 39 §4). The rust-test job of ci.yml uploads one lcov
# report with all four Rust flags, and each flag's paths select its crate from it; the ui job
# uploads Vitest's report with the ui flag. The ui and app flags are measured, not gated.
codecov:
  # Post the patch checks as soon as the rust-test upload, which carries both gated flags, is
  # processed, whatever the other statuses say (D-091): a gated PR's gate/maintainer status fails
  # until the maintainer decides, and the checks must report meanwhile, or a merge on a relayed
  # authorization (D-078) never has every other required check green. Waiting for CI instead left
  # them in progress for good (#113).
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

coverage:
  status:
    # Reported, never failing: coverage is a floor, not a goal.
    project:
      default:
        informational: true
    # Required checks on `main` (PR-GIT-043): codecov/patch/tlilli-core and codecov/patch/tlilli-mcp.
    # A pull request that changes no line of the crate passes its check.
    patch:
      tlilli-core:
        target: 80%
        flags: [tlilli-core]
      tlilli-mcp:
        target: 80%
        flags: [tlilli-mcp]

# Vitest writes paths relative to ui/ (src/App.tsx); map them onto the repository's.
fixes:
  - "^src/::ui/src/"

flags:
  tlilli-core:
    paths: [crates/tlilli-core/]
  tlilli-mcp:
    paths: [crates/tlilli-mcp/]
  tlilli-cli:
    paths: [crates/tlilli-cli/]
  app:
    paths: [src-tauri/]
  ui:
    paths: [ui/src/]

# A minimal comment, posted only when coverage changes.
comment:
  layout: condensed_header, condensed_files
  require_changes: true

[package]
name = "tlilli-app"
description = "Tlilli desktop app: the Tauri 2 shell with its window, updater and capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# The app ships as bundles on the GitHub Release, never as a crate (PRD 21 §2, ADR-0001).
# tauri.conf.json has no `version`, so Tauri takes this crate's workspace version (PR-REL-002).
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
# Wired with the minisign public key and the docs-site endpoints in tauri.conf.json (PR-REL-030).
tauri-plugin-updater = "2.14.1"
# `tauri::generate_context!` expands to code that names `::serde_json` for the plugin
# configuration, so the app crate must depend on it directly.
serde_json = "1.0.154"

[lints]
workspace = true

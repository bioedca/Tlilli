---
# Feature request. Fields and labels: docs/prd/36-issues-labels-and-projects.md
# §1; user-story wording per §7.
name: Feature request
description: >-
  A capability Tlilli should have, written as a user story with its
  motivation.
title: "[feature]: "
labels:
  - type/feature
  - status/triage
body:
  - type: markdown
    attributes:
      value: |
        One feature per issue. Tlilli's scope and non-goals are in
        `docs/prd/01-vision-and-scope.md`; a request outside them is
        closed as not planned with a note.
  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: One sentence in the form below.
      placeholder: "As a <role>, I want <goal>, so that <impact>."
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: >-
        The situation that makes this necessary: what you do today, where it
        hurts, how often.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        Other ways to get the same outcome, inside or outside Tlilli, and why
        they fall short.
  - type: textarea
    id: acceptance
    attributes:
      label: Proposed acceptance criteria
      description: Testable statements; one per line.
      placeholder: |
        - [ ] ...
        - [ ] ...
  - type: input
    id: requirements
    attributes:
      label: Related requirement IDs
      description: >-
        Existing IDs this extends or conflicts with, from docs/prd (FR-, NFR-).
      placeholder: "FR-02-031, FR-02-040"
  - type: dropdown
    id: phase
    attributes:
      label: Phase suggestion
      description: >-
        Where you think it fits (docs/prd/40-roadmap-and-gates.md). Triage
        sets the phase label and milestone.
      options:
        - 0 Foundation
        - v0.1 Black ink
        - v0.2 Red ink
        - v0.3 Ledger
        - v0.4 Sweep and style
        - v0.5 Beyond the article
        - v1.0 Public
        - post-1.0

# Syncs the repository's labels from .github/labels.yml (docs/prd/36-issues-labels-and-projects.md §2).
# Runs on main only; the config file is the source of truth and every label not in it is deleted.
name: labels-sync

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels-sync.yml
  workflow_dispatch:

permissions: read-all

concurrency:
  group: labels-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout reads .github/labels.yml
      issues: write # create, update and delete the repository's labels
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/labels.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: .github/labels.yml
          delete-other-labels: true

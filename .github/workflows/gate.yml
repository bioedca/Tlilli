# gate/maintainer: the human gate as a required commit status (docs/prd/32-code-review.md §5, D-053;
# rules PR-REV-010..012). Agent pull requests are authored by the maintainer's own account (D-014), so
# "require a code-owner approval" cannot express the gate; this workflow can.
#
# The verdict is the commit status `gate/maintainer` on the PR's current head; the `main` ruleset
# (bootstrap task 27) requires that status context, not a check run. Every evaluation first sets it to
# `pending` ("evaluating"), then to `success` or `failure` with a short reason, or `error` if the
# evaluator throws, so a crashed run leaves `pending`, which blocks the merge: the gate fails closed and
# never leaves a stale success. The job's own check run (`gate / evaluate`) fails only on evaluator
# errors. A status belongs to a commit, not to a PR, so when several open PRs share a head the status on
# it is the conjunction of their verdicts. Each verdict's details are in the run's job summary, linked
# from the status.
#
# Triggers. Both run the default branch's copy of this file with the base repository's token, and the job
# never checks out or executes PR code (PR-CI-006); it only calls the API.
# - `pull_request_target` for PR changes. Events that cannot change a verdict (labels other than `gate`
#   and `gate:approved`, `edited` without a base change) skip the job, so they never queue in the
#   concurrency group and never supersede a queued evaluation.
# - `workflow_run` of `gate relay` (gate-relay.yml) for review events: no `pull_request_target` type
#   covers a review or its dismissal, and `pull_request_review` runs the PR's own copy of a workflow, which
#   a PR editing it could turn into a no-op success. The relay runs on `pull_request_review` and does
#   nothing; its completion makes GitHub start this trusted copy. Its conclusion and content are ignored,
#   only its PR identity is used, and the PR's current head is always evaluated. `workflow_run` fires only
#   once this file is on the default branch, so the PR that adds it sees `pull_request_target` runs only.
# Re-evaluation routes: a review, an edit or a dismissal re-evaluates automatically through the relay; for
# anything without an event (a variable, or CODEOWNERS on the base, changed) use "Re-run all jobs" on the
# latest gate run, or (re-)apply `gate:approved`. The `push` to `main` trigger in PR-REV-010 is omitted:
# the ruleset's "require branches to be up to date" re-runs the evaluation through `synchronize`.
#
# Verdict, computed from the API on every run, never from a previous run:
# - Changed files (new and previous names) are matched against .github/CODEOWNERS as it stands on the
#   PR's current base. No match: success. The `gate` label is routing only (labeler.yml), reconciled here
#   from the same files: re-applied when removed from a gated PR (PR-PRQ-033), removed when no gated file
#   is left.
# - A gated PR succeeds when a gate authority approved the current head against the current base, by:
#   * a review in state APPROVED on the head SHA, submitted after the last base change; or
#   * the `gate:approved` label, whose latest `labeled` event is by a gate authority in person (its
#     `performed_via_github_app` is null) and later than the last base change, with its approval record:
#     when an authority applies the label in person, that `labeled` run writes the commit status
#     `gate/approval-record` ("approved-by:<login> base:<ref>") on the PR head of the event. The record counts only on the current head, written by github-actions[bot],
#     naming a gate authority and the current base, and created after the last base change. A new push
#     has no record, so an approval never carries over to new commits (PR-REV-011).
#   The last base change is the newest `base_ref_changed` timeline event, or the PR's creation. Every time
#   compared is a GitHub server time.
# - Gate authorities: the maintainer always; the backup admin only while the repository Actions variable
#   HANDOFF_ACTIVE is `true` AND the variable BACKUP_ADMIN names their login AND that login is listed in
#   CODEOWNERS (PRD 32 §3: never on the CODEOWNERS entry alone; PRD 38 §8).
# - Courtesy steps the verdict never depends on: on `synchronize` a `gate:approved` label older than the
#   push is removed with "gate approval reset by new commits"; on a base change, or when the label
#   predates the last base change, with "gate approval reset: base changed". A label applied by anyone
#   else (PR-REV-012), or through any GitHub App, is removed with a comment and never gets a record. An authority's label without a valid record is left in
#   place, because its `labeled` run may still be queued; the status then says to remove and re-apply it.
#
# Agent sessions act as the maintainer's account through the Claude GitHub App (D-014). A label applied
# that way carries `performed_via_github_app` in the timeline, so the gate refuses it: `gate:approved`
# counts only when a gate authority applies it in person (web, mobile, or `gh` with an OAuth token).
# Reviews carry no such field (REST reviews, timeline `reviewed` events and GraphQL `PullRequestReview`
# expose none), so an agent session could submit an APPROVED review as the maintainer on a PR the
# maintainer did not author. Agent PRs are authored as `bioedca`, where GitHub already blocks
# self-approval; the residual case is contributor PRs, covered only by PR-PRQ-032.
#
# Residual risk. On a personal account the ruleset rule "Require workflows to pass" is unavailable
# (D-057), so a same-repository PR that adds or edits a workflow file could post a forged
# `gate/maintainer` or `gate/approval-record` status from its own workflow, or edit gate-relay.yml to
# suppress re-evaluation on reviews. Mitigations in place: `.github/workflows/**` is gated and labelled
# `gate` by the path labeler, fork workflows need maintainer approval before they run (PR-CI-008), and
# the agent rules forbid touching workflows outside their task. The gate protects against ordinary agent
# behaviour and mistakes, not against an adversarial workflow change.
#
# Repository Actions variables (docs/dev/github-settings.md §4):
#   HANDOFF_ACTIVE  `false` normally; the backup admin sets `true` to start a handoff (PRD 38 §8).
#   BACKUP_ADMIN    GitHub login of the backup admin, without `@`; empty until they are named.
name: gate

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no PR code is run; API calls only
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  workflow_run: # zizmor: ignore[dangerous-triggers] relay identity only; no artifact, checkout or PR code
    workflows: [gate relay]
    types: [completed]

permissions: {}

jobs:
  evaluate:
    name: evaluate
    if: >-
      github.event_name == 'workflow_run' ||
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null) ||
      contains(fromJSON('["gate","gate:approved"]'), github.event.label.name)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One group per PR head (head repository and branch), shared by both triggers so evaluations of a PR
    # never run concurrently: a relay run's payload has no PR number for fork PRs, but it has the head
    # repository and branch. Never cancel an in-progress run: runs are a few idempotent API calls, and a
    # cancelled `labeled` run would lose its approval record. A queued run superseded by a newer event is
    # replaced by that event's run, which re-evaluates everything. Two open PRs from one head branch
    # share a group; both are evaluated together because they share the head commit.
    concurrency:
      group: gate-${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: read # read .github/CODEOWNERS from the base branch through the API
      pull-requests: write # list PRs, files, reviews and the timeline; add or remove labels; comment
      statuses: write # write the `gate/maintainer` verdict and the `gate/approval-record`; list statuses
    steps:
      - name: Evaluate the gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          MAINTAINER: bioedca
          BACKUP_ADMIN: ${{ vars.BACKUP_ADMIN }}
          HANDOFF_ACTIVE: ${{ vars.HANDOFF_ACTIVE }}
        with:
          retries: 2
          script: |
            const APPROVED = 'gate:approved';
            const GATE = 'gate';
            const VERDICT = 'gate/maintainer';
            const RECORD = 'gate/approval-record';
            const BOT = 'github-actions[bot]';
            const { owner, repo } = context.repo;
            const ev = context.payload;
            const isPrt = context.eventName === 'pull_request_target';
            const action = ev.action;
            const short = (sha) => String(sha || '').slice(0, 7);
            const lower = (s) => String(s || '').trim().replace(/^@/, '').toLowerCase();
            const clip = (s) => (s.length > 140 ? `${s.slice(0, 139)}…` : s);
            const iso = (d) => (d ? d.toISOString() : 'never');
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const setStatus = (sha, state, description, ctx = VERDICT) => github.rest.repos.createCommitStatus({
              owner, repo, sha, state, context: ctx, description: clip(description), target_url: runUrl,
            });
            const maintainer = lower(process.env.MAINTAINER);
            const backupAdmin = lower(process.env.BACKUP_ADMIN);
            const handoffActive = lower(process.env.HANDOFF_ACTIVE) === 'true';

            // CODEOWNERS pattern → RegExp over repository-relative paths (gitignore-style subset).
            const toRegex = (pattern) => {
              if (/^!|[\[\]\\]/.test(pattern)) throw new Error(`unsupported CODEOWNERS pattern: ${pattern}`);
              let p = pattern;
              const dirOnly = p.endsWith('/');
              if (dirOnly) p = p.slice(0, -1);
              const anchored = p.includes('/');
              if (p.startsWith('/')) p = p.slice(1);
              let re = '';
              for (let i = 0; i < p.length; i++) {
                const c = p[i];
                if (c === '*' && p[i + 1] === '*') {
                  i++;
                  if (p[i + 1] === '/') { i++; re += '(?:.*/)?'; } else re += '.*';
                } else if (c === '*') re += '[^/]*';
                else if (c === '?') re += '[^/]';
                else re += c.replace(/[.+^${}()|]/g, '\\$&');
              }
              return new RegExp((anchored ? '^' : '^(?:.*/)?') + re + (dirOnly ? '/.+$' : '(?:/.*)?$'));
            };
            // CODEOWNERS from the base branch, the trusted copy, so a PR cannot un-gate itself. null: missing.
            const rulesByBase = new Map();
            const loadRules = async (ref) => {
              if (rulesByBase.has(ref)) return rulesByBase.get(ref);
              let text = null;
              try {
                const res = await github.rest.repos.getContent({ owner, repo, path: '.github/CODEOWNERS', ref, mediaType: { format: 'raw' } });
                text = typeof res.data === 'string' ? res.data : Buffer.from(res.data.content, 'base64').toString('utf8');
              } catch (e) { if (e.status !== 404) throw e; }
              const rules = text === null ? null : text.split('\n').map((raw) => raw.replace(/(^|\s)#.*$/, '').trim()).filter(Boolean)
                .map((line) => { const [pattern, ...owners] = line.split(/\s+/); return { owners: owners.map(lower), regex: toRegex(pattern) }; });
              rulesByBase.set(ref, rules);
              return rules;
            };

            // One PR's verdict: { number, state: 'success' | 'failure', description }.
            const decide = async (pr) => {
              const { number } = pr;
              const headSha = pr.head.sha;
              const baseRef = pr.base.ref;
              const trigger = isPrt && number === ev.pull_request.number;
              const sum = core.summary.addHeading(`PR #${number}: head ${short(headSha)}, base ${baseRef}`, 3);
              const rules = await loadRules(baseRef);
              if (!rules) return { number, state: 'failure', description: `no .github/CODEOWNERS on ${baseRef}: the gate cannot be evaluated` };
              // CODEOWNERS semantics: the last matching rule wins; a rule without owners clears ownership.
              const isGated = (path) => Boolean([...rules].reverse().find((r) => r.regex.test(path))?.owners.length);
              const listedOwners = new Set(rules.flatMap((r) => r.owners));
              const authorities = new Map([[maintainer, 'maintainer']]);
              const notes = [];
              if (backupAdmin) {
                if (!handoffActive) notes.push(`@${backupAdmin} (BACKUP_ADMIN) is not a gate authority while HANDOFF_ACTIVE is not 'true'`);
                else if (!listedOwners.has(backupAdmin)) notes.push(`@${backupAdmin} (BACKUP_ADMIN) is not listed in .github/CODEOWNERS on ${baseRef}; not a gate authority`);
                else authorities.set(backupAdmin, 'backup admin, HANDOFF_ACTIVE=true');
              }
              const authorityList = [...authorities].map(([l, why]) => `@${l} (${why})`).join(', ');
              const labels = new Set(pr.labels.map((l) => l.name));
              const comment = (body) => github.rest.issues.createComment({ owner, repo, issue_number: number, body });
              const removeLabel = async (name) => {
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name }); }
                catch (e) { if (e.status !== 404) throw e; }
                labels.delete(name);
              };
              const reapply = 'A gate authority re-applies it, or approves the head by review, after reviewing the change.';
              const actorReset = (who) => comment(`\`${APPROVED}\` applied by ${who} was removed: only a gate authority may apply it (PR-REV-012). Gate authorities now: ${authorityList}.`);

              // The timeline gives the last base change and the latest `gate:approved` label event, in server time.
              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, { owner, repo, issue_number: number, per_page: 100 });
              let lastBaseChange = new Date(pr.created_at);
              let labelEvent = null;
              for (const t of timeline) {
                const at = new Date(t.created_at);
                if (t.event === 'base_ref_changed' && at > lastBaseChange) lastBaseChange = at;
                if (['labeled', 'unlabeled'].includes(t.event) && t.label?.name === APPROVED && (!labelEvent || at >= new Date(labelEvent.created_at))) labelEvent = t;
              }
              const labelActor = labelEvent?.event === 'labeled' ? lower(labelEvent.actor?.login) : '';
              const labeledAt = labelEvent ? new Date(labelEvent.created_at) : null;
              const who = labelActor ? `@${labelActor}` : 'an unknown actor';
              // Non-empty when the latest label event was made through a GitHub App (an agent session acting as a user).
              const via = labelEvent?.performed_via_github_app;
              const labelApp = labelEvent?.event === 'labeled' && via ? via.slug || 'unknown' : '';
              const appReset = (slug) => comment(`\`${APPROVED}\` applied through the GitHub App ${slug} was removed: the maintainer applies it in person (PR-PRQ-032).`);

              // Handlers for the event of the triggering PR (pull_request_target only; courtesy and the record).
              if (trigger && action === 'synchronize' && labels.has(APPROVED) && !(labeledAt > new Date(ev.pull_request.updated_at))) {
                await removeLabel(APPROVED);
                await comment(`gate approval reset by new commits: \`${APPROVED}\` was removed because ${short(headSha)} was pushed after it was applied (PR-REV-011). ${reapply}`);
              }
              if (trigger && action === 'edited' && ev.changes?.base && labels.has(APPROVED)) {
                await removeLabel(APPROVED);
                await comment(`gate approval reset: base changed from \`${ev.changes.base.ref?.from}\` to \`${baseRef}\`, so \`${APPROVED}\` was removed. ${reapply}`);
              }
              if (trigger && action === 'labeled' && ev.label?.name === APPROVED) {
                const sender = lower(ev.sender?.login);
                if (!authorities.has(sender)) {
                  await removeLabel(APPROVED);
                  await actorReset(`@${sender}`);
                } else if (labelApp) {
                  await removeLabel(APPROVED);
                  await appReset(labelApp);
                } else if (labelEvent?.event === 'labeled' && labelActor === sender) {
                  // The approval record: this trusted run saw a gate authority apply the label in person while
                  // the PR's head and base were those of the event payload. If the timeline does not show this
                  // event as the latest one, no record is written and the evaluation below says to re-apply.
                  const record = `approved-by:${sender} base:${ev.pull_request.base.ref}`;
                  if (record.length > 140) throw new Error(`approval record longer than 140 characters: ${record}`);
                  await setStatus(ev.pull_request.head.sha, 'success', record, RECORD);
                }
              }

              // Gated files: new and previous names of every changed file.
              const gated = [];
              if (pr.changed_files > 3000) {
                gated.push('(more than 3000 changed files: the API cannot list them all, so the PR counts as gated)');
              } else {
                const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
                const paths = new Set();
                for (const f of files) { paths.add(f.filename); if (f.previous_filename) paths.add(f.previous_filename); }
                gated.push(...[...paths].filter(isGated).sort());
              }
              // Reconcile the routing label `gate` from the same files.
              if (gated.length && !labels.has(GATE)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [GATE] });
                if (trigger && action === 'unlabeled' && ev.label?.name === GATE) {
                  await comment(`\`${GATE}\` is applied by automation from the gated paths and was re-applied (PR-PRQ-033). Gated files: ${gated.map((p) => `\`${p}\``).join(', ')}.`);
                }
              } else if (!gated.length && labels.has(GATE)) {
                await removeLabel(GATE);
              }
              sum.addRaw(`Gate authorities: ${authorityList}. Last base change: ${iso(lastBaseChange)}.`, true);
              if (notes.length) sum.addList(notes);
              if (!gated.length) {
                sum.addRaw('No changed file matches a CODEOWNERS path: no approval needed.', true);
                return { number, state: 'success', description: 'no gated path touched' };
              }

              // Approvals of the current head against the current base.
              const grants = [];
              const ignored = [];
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 });
              const latest = new Map();
              for (const r of reviews) {
                if (!['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) continue;
                const login = lower(r.user?.login);
                const prev = latest.get(login);
                if (!prev || new Date(r.submitted_at) >= new Date(prev.submitted_at)) latest.set(login, r);
              }
              for (const [login, r] of latest) {
                if (r.state !== 'APPROVED') continue;
                if (!authorities.has(login)) ignored.push(`review by @${login}: not a gate authority`);
                else if (r.commit_id !== headSha) ignored.push(`review by @${login} is for ${short(r.commit_id)}, not the head ${short(headSha)}`);
                else if (!(new Date(r.submitted_at) > lastBaseChange)) ignored.push(`review by @${login} predates the base change`);
                else grants.push(`review by @${login} on ${short(headSha)}`);
              }
              if (labels.has(APPROVED)) {
                if (!labelActor || !authorities.has(labelActor)) {
                  ignored.push(`label by ${who}: not a gate authority`);
                  await removeLabel(APPROVED);
                  await actorReset(who);
                } else if (labelApp) {
                  ignored.push(`label by ${who} through the GitHub App ${labelApp}, not in person`);
                  await removeLabel(APPROVED);
                  await appReset(labelApp);
                } else if (!(labeledAt > lastBaseChange)) {
                  ignored.push(`label by ${who} predates the base change`);
                  await removeLabel(APPROVED);
                  await comment(`gate approval reset: base changed to \`${baseRef}\` at ${iso(lastBaseChange)}, after \`${APPROVED}\` was applied, so it was removed. ${reapply}`);
                } else {
                  // Newest first; the newest record for this base decides.
                  const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, { owner, repo, ref: headSha, per_page: 100 });
                  const parse = (s) => (s.description || '').match(/^approved-by:(\S+) base:(\S+)$/);
                  const record = statuses.find((s) => s.context === RECORD && parse(s)?.[2] === baseRef);
                  const by = record ? lower(parse(record)[1]) : '';
                  let invalid = '';
                  if (!record) invalid = `no record for ${baseRef} on ${short(headSha)}`;
                  else if (record.state !== 'success') invalid = `record is ${record.state}`;
                  else if (lower(record.creator?.login) !== BOT) invalid = `record not written by ${BOT}`;
                  else if (!authorities.has(by)) invalid = `record names @${by}, not a gate authority`;
                  else if (!(new Date(record.created_at) > lastBaseChange)) invalid = `record predates the base change`;
                  if (invalid) ignored.push(`label by ${who}: ${invalid}; re-apply it`);
                  else grants.push(`${APPROVED} by ${who}, record on ${short(headSha)}`);
                }
              }
              sum.addRaw('Gated files:', true).addList(gated.map((p) => `\`${p}\``));
              if (grants.length) sum.addRaw('Approval:', true).addList(grants);
              if (ignored.length) sum.addRaw(`Ignored (re-apply a label by removing and adding it; last base change ${iso(lastBaseChange)}):`, true).addList(ignored);
              if (grants.length) return { number, state: 'success', description: `approved: ${grants[0]}` };
              const why = `needs approval on ${short(headSha)} (${gated.length} gated file${gated.length === 1 ? '' : 's'})`;
              sum.addRaw(`${why}: a review from a gate authority, or \`${APPROVED}\` applied by one (${authorityList}). The decision is recorded in a PR comment (PR-REV-013).`, true);
              return { number, state: 'failure', description: `${why}${ignored.length ? `; ignored: ${ignored[0]}` : ''}` };
            };

            // Fail closed from the first API call: the head this event saw is `pending` until decided.
            const eventSha = isPrt ? ev.pull_request.head.sha : ev.workflow_run.head_sha;
            const undecided = new Set([eventSha]);
            await setStatus(eventSha, 'pending', 'evaluating');
            try {
              // The PRs to evaluate. A relay run is trusted for its PR identity only.
              const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
              let numbers;
              if (isPrt) numbers = [ev.pull_request.number];
              else {
                const wr = ev.workflow_run;
                numbers = (wr.pull_requests || []).filter((p) => p.base?.repo?.id === ev.repository.id).map((p) => p.number);
                if (!numbers.length) {
                  numbers = open.filter((p) => p.head.repo?.full_name === wr.head_repository?.full_name
                    && p.head.ref === wr.head_branch && p.head.sha === wr.head_sha).map((p) => p.number);
                }
              }
              // Group by current head: a status on a head is the conjunction over every open PR with that head.
              const groups = new Map();
              const add = (pr) => { if (!groups.has(pr.head.sha)) groups.set(pr.head.sha, new Map()); groups.get(pr.head.sha).set(pr.number, pr); };
              for (const n of new Set(numbers)) add((await github.rest.pulls.get({ owner, repo, pull_number: n })).data);
              for (const p of open) {
                if (!groups.has(p.head.sha) || groups.get(p.head.sha).has(p.number)) continue;
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number: p.number });
                if (data.head.sha === p.head.sha) add(data);
              }
              if (!groups.size) core.notice(`no open pull request with head ${short(eventSha)} to evaluate`);
              for (const [sha, prs] of groups) {
                if (!undecided.has(sha)) { await setStatus(sha, 'pending', 'evaluating'); undecided.add(sha); }
                const results = [];
                for (const pr of prs.values()) results.push(await decide(pr));
                const bad = results.filter((r) => r.state !== 'success');
                const description = results.length === 1 ? results[0].description
                  : bad.length ? `#${bad[0].number}: ${bad[0].description}` : `all ${results.length} open PRs with this head pass`;
                await setStatus(sha, bad.length ? 'failure' : 'success', description);
                undecided.delete(sha);
                core.info(`${short(sha)}: ${bad.length ? 'failure' : 'success'}: ${description}`);
              }
            } catch (e) {
              for (const sha of undecided) await setStatus(sha, 'error', `evaluator error: ${e.message}`).catch(() => {});
              throw e;
            } finally {
              await core.summary.write();
            }

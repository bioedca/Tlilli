# Path labels on pull requests from .github/labeler.yml: area/*, gate, review:deep
# (docs/prd/32-code-review.md PR-REV-014; docs/prd/33-ci-cd.md §1).
# pull_request_target runs in the base-branch context so the token may write labels on fork PRs; the
# job never checks out or executes PR code (PR-CI-006): actions/labeler reads the configuration from
# the base branch through the API and only lists the PR's changed files.
name: labeler

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no PR code is run
    types: [opened, synchronize, reopened, ready_for_review]

permissions: read-all

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: path labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # actions/labeler fetches .github/labeler.yml from the base branch
      pull-requests: write # add and remove labels on the pull request
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          # false: path labels are re-added on every run (PR-PRQ-033) but labels an author applied by
          # hand, such as review:deep or an area/* correction (PR-PRQ-030), are never stripped.
          sync-labels: false
          dot: true

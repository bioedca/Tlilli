name: ci

# The Linux lane of PRD 33 §2. Bootstrap task 20 lands it in parts: rust-lint and rust-test, then
# ui and docs-build, then the pull-request checks. The job ids and names are the check names of
# PR-GIT-043, which the `main` ruleset requires.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]

# A newer push to a pull request cancels its older run. Runs on `main` are never cancelled
# (PR-CI-015, D-080): each gets its own group, because GitHub replaces a group's pending run
# with a newer one whatever cancel-in-progress says.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {} # each job declares the scopes it needs (PR-CI-003)

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tauri 2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo deny check # advisories, licenses, bans, sources (deny.toml)
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The tests run under cargo-llvm-cov, which instruments the build; scripts/ci.sh runs the same
  # nextest commands without it. Each Codecov flag's paths in codecov.yml select its crate.
  rust-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the Codecov upload authenticates by OIDC; no token is stored (D-061)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tauri 2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Toolchain from rust-toolchain.toml, with the LLVM tools for coverage
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150,cargo-llvm-cov@0.9.1
      - name: Tests with coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --no-report --workspace --all-features
          cargo llvm-cov nextest --no-report -p tlilli-core --no-default-features
          cargo llvm-cov report --lcov --output-path lcov.info
      - run: cargo test --doc --workspace
      # Dependabot's runs get no OIDC token, so they upload nothing (PRD 39 §5). A fork's pull
      # request uploads without one, which Codecov accepts for a public repository.
      - if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: lcov.info
          disable_search: true
          flags: tlilli-core,tlilli-mcp,tlilli-cli,app
          fail_ci_if_error: true

  # Biome in CI mode, the type check, Vitest with coverage, the build, and the Playwright smoke
  # subset against the mocked core; the full Playwright suite runs nightly (bootstrap task 22).
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # the Codecov upload authenticates by OIDC; no token is stored (D-061)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ui/package.json # the packageManager field lives in ui/, not at the root
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui exec biome ci . # lint and format check; writes nothing
      - run: pnpm -C ui typecheck # tsc --noEmit
      - run: pnpm -C ui exec vitest run --coverage # writes ui/coverage/lcov.info
      - run: pnpm -C ui build
      - run: pnpm -C ui exec playwright install --with-deps chromium
      - run: pnpm -C ui exec playwright test --grep @smoke
      # As in rust-test: no upload from Dependabot's runs, none of which get an OIDC token.
      - if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: ui/coverage/lcov.info
          disable_search: true
          flags: ui
          fail_ci_if_error: true

  # The strict MkDocs build with the hash-pinned toolchain, and rustdoc under site/api, as docs.yml
  # builds them for Pages; the site is kept as an artifact for 7 days (PR-CI-016).
  docs-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # git-revision-date-localized reads each page's last commit date
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13" # the version docs/requirements.txt was compiled with
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install --require-hashes -r docs/requirements.txt
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1" # Material's end-of-life notice, as in docs.yml
      - name: Tauri 2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/api_docs.sh # rustdoc into site/api, with a page that lists the crates
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 7
          if-no-files-found: error

  # The checks of a pull request's diff (PRD 33 §2), in scripts/pr_checks.sh, which scripts/ci.sh
  # also runs. The labels and description reach the script through env, never inside a run line
  # (template injection). Both are the triggering event's: adding a label re-runs the checks,
  # editing the description does not.
  size-limit:
    name: size/limit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the base and the head commits, for the diff
          persist-credentials: false
      - run: scripts/pr_checks.sh size
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}

  docs-contract-sync:
    name: docs/contract-sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the base and the head commits, for the diff
          persist-credentials: false
      - run: scripts/pr_checks.sh contract-sync
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}

  # Compile check of the full app (PRD 33 §2, bootstrap task 14): `tauri build` runs the UI build
  # and compiles the release shell with the UI embedded, without bundling or signing.
  tauri-linux:
    name: tauri/linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tauri 2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-04
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui tauri build --no-bundle

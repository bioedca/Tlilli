name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Bootstrap guard: the repository has no Cargo workspace or UI package yet, so the
  # rust and ui jobs are skipped until their manifests exist. A job-level `if` cannot
  # use hashFiles() (it runs before checkout), hence this probe job. Remove it when the
  # workspace layout is real (PRD Phase 0, docs/prd/42-bootstrap-backlog.md task 20).
  detect:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.probe.outputs.rust }}
      ui: ${{ steps.probe.outputs.ui }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: probe
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true"; else echo "rust=false"; fi >> "$GITHUB_OUTPUT"
          if [ -f ui/package.json ]; then echo "ui=true"; else echo "ui=false"; fi >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  rust:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tauri 2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-04
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ui/package.json # the packageManager field lives in ui/, not at the root
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui build

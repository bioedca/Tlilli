name: ci

# The jobs of PRD 33 §2. Bootstrap task 20 landed them in parts: rust-lint and rust-test, then ui
# and docs-build, then the pull-request checks, then the build/* matrix of the release targets,
# then protocol-ref/drift and workflows/zizmor, and e2e/smoke last; reuse and scripts followed
# (D-088). The job ids and names are the check names of PR-GIT-043, which the `main` ruleset requires.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

# A newer push to a pull request cancels its older run. Runs on `main` are never cancelled
# (PR-CI-015, D-080): each gets its own group, because GitHub replaces a group's pending run
# with a newer one whatever cancel-in-progress says.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {} # each job declares the scopes it needs (PR-CI-003)

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tauri-deps # zizmor: ignore[self-repository] actionlint rejects the $/ form
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny@0.20.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo deny check # advisories, licenses, bans, sources (deny.toml)
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The tests run under cargo-llvm-cov, which instruments the build; scripts/ci.sh runs the same
  # nextest commands without it. Each Codecov flag's paths in codecov.yml select its crate.
  rust-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the Codecov upload authenticates by OIDC; no token is stored (D-061)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tauri-deps # zizmor: ignore[self-repository] actionlint rejects the $/ form
      - name: Toolchain from rust-toolchain.toml, with the LLVM tools for coverage
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.150,cargo-llvm-cov@0.9.1
      - name: Tests with coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --no-report --workspace --all-features
          cargo llvm-cov nextest --no-report -p tlilli-core --no-default-features
          cargo llvm-cov report --lcov --output-path lcov.info
      - run: cargo test --doc --workspace
      # Dependabot's runs get no OIDC token, so they upload nothing (PRD 39 §5). A fork's pull
      # request uploads without one, which Codecov accepts for a public repository.
      - if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: lcov.info
          disable_search: true
          flags: tlilli-core,tlilli-mcp,tlilli-cli,app
          fail_ci_if_error: true

  # Biome in CI mode, the type check, Vitest with coverage, the build, and the Playwright smoke
  # subset against the mocked core; the full Playwright suite runs nightly (bootstrap task 22).
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # the Codecov upload authenticates by OIDC; no token is stored (D-061)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json # the packageManager field lives in ui/, not at the root
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui exec biome ci . # lint and format check; writes nothing
      - run: pnpm -C ui typecheck # tsc --noEmit
      - run: pnpm -C ui exec vitest run --coverage # writes ui/coverage/lcov.info
      - run: pnpm -C ui build
      - run: pnpm -C ui exec playwright install --with-deps chromium
      - run: pnpm -C ui exec playwright test --grep @smoke
      # As in rust-test: no upload from Dependabot's runs, none of which get an OIDC token.
      - if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: ui/coverage/lcov.info
          disable_search: true
          flags: ui
          fail_ci_if_error: true

  # The strict MkDocs build with the hash-pinned toolchain, and rustdoc under site/api, as docs.yml
  # builds them for Pages; the site is kept as an artifact for 7 days (PR-CI-016).
  docs-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-revision-date-localized reads each page's last commit date
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13" # the version docs/requirements.txt was compiled with
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install --require-hashes -r docs/requirements.txt
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1" # Material's end-of-life notice, as in docs.yml
      - uses: ./.github/actions/tauri-deps # zizmor: ignore[self-repository] actionlint rejects the $/ form
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/api_docs.sh # rustdoc into site/api, with a page that lists the crates
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 7
          if-no-files-found: error

  # The checks of a pull request's diff (PRD 33 §2), in scripts/pr_checks.sh, which scripts/ci.sh
  # also runs. The labels and description reach the script through env, never inside a run line
  # (template injection). Both are the triggering event's: adding or removing a label re-runs the
  # checks, editing the description does not.
  size-limit:
    name: size/limit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base and the head commits, for the diff
          persist-credentials: false
      - run: scripts/pr_checks.sh size
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}

  docs-contract-sync:
    name: docs/contract-sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base and the head commits, for the diff
          persist-credentials: false
      - run: scripts/pr_checks.sh contract-sync
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}

  # The commits check (PRD 33 §2) in scripts/pr_checks.sh: commitlint on every commit and on the
  # title, at most 10 commits and no merge commit, the branch name and the template's sections, then
  # cargo check at each commit. The title and description come from the API when the job runs, so a
  # re-run after editing them checks the edit.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # the title and description as they are now
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit of the pull request
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile # commitlint
      - name: Messages, title, count, branch and description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          PR_TITLE=$(jq -r .title <<<"$pr") PR_BODY=$(jq -r '.body // ""' <<<"$pr") \
            scripts/pr_checks.sh commits
      - uses: ./.github/actions/tauri-deps # zizmor: ignore[self-repository] actionlint rejects the $/ form
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/pr_checks.sh build-each
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}

  # The generated reference pages under docs/reference/ against their generators (PR-DOC-003):
  # scripts/gen_reference.sh --check regenerates them into a scratch directory and diffs the two.
  # rust-test runs the same comparison as a test; this check names it for the ruleset (PR-GIT-043).
  protocol-ref-drift:
    name: protocol-ref/drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/gen_reference.sh --check

  # The workflows' own lint (PRD 33 §2): zizmor at --min-severity low (unpinned actions, template
  # injection, dangerous triggers, persisted credentials), then actionlint. zizmor runs offline, the
  # same audits as scripts/ci.sh runs locally without a token. Both tools are fixed releases whose
  # downloads are checked against their published SHA-256.
  workflows-zizmor:
    name: workflows/zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ZIZMOR_WHEEL: https://files.pythonhosted.org/packages/6f/b2/45f4fcb6f428e774750709ecf5320ba6d96393c03b941d9f37a4586f6924/zizmor-1.32.0-py3-none-manylinux_2_28_x86_64.whl
      ZIZMOR_SHA256: 84a6acb975accc13408786a2bd274b572537ca19c933ebbc13e78f3988562071
      ACTIONLINT_TAR: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor 1.32.0 and actionlint 1.7.12
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          wheel="$tools/${ZIZMOR_WHEEL##*/}"
          curl -fsSL --retry 3 -o "$wheel" "$ZIZMOR_WHEEL"
          echo "$ZIZMOR_SHA256  $wheel" | sha256sum -c -
          curl -fsSL --retry 3 -o "$tools/actionlint.tar.gz" "$ACTIONLINT_TAR"
          echo "$ACTIONLINT_SHA256  $tools/actionlint.tar.gz" | sha256sum -c -
          python3 -m venv "$tools/venv"
          "$tools/venv/bin/pip" install --quiet --disable-pip-version-check --no-deps "$wheel"
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          echo "$tools/venv/bin" >>"$GITHUB_PATH"
          echo "$tools" >>"$GITHUB_PATH"
      - run: zizmor --offline --min-severity low .github/workflows
      - run: actionlint

  # Compile check of the full app (PRD 33 §2, bootstrap task 14): `tauri build` runs the UI build
  # and compiles the release shell with the UI embedded, without bundling or signing.
  tauri-linux:
    name: tauri/linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tauri-deps # zizmor: ignore[self-repository] actionlint rejects the $/ form
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-04
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui tauri build --no-bundle

  # The desktop smoke suite (PRD 34 §1, D-086): tauri-driver starts the debug app, built with the
  # UI embedded, and drives it through WebKitWebDriver under a virtual display. Linux only, since
  # tauri-driver has no macOS driver. The test step keeps PRD 33's bound of 10 minutes, and the
  # suite retries a failed test once, the one retry PR-CI-009 allows.
  e2e-smoke:
    name: e2e/smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tauri-deps # zizmor: ignore[self-repository] actionlint rejects the $/ form
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-04
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The cache above keeps ~/.cargo/bin, so a warm run finds tauri-driver installed.
      - run: cargo install --locked tauri-driver@2.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui tauri build --debug --no-bundle
      - run: xvfb-run -a pnpm -C ui test:e2e:desktop
        timeout-minutes: 10

  # REUSE 3.3 compliance (D-003, D-088, docs/dev/licensing.md): every file declares its copyright
  # and licence. `reuse` comes from the hash-pinned scripts/reuse-requirements.txt; fsfe/reuse-action
  # is not on the PR-CI-019 allow-list, so the job runs the tool itself.
  reuse:
    name: reuse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13" # the version scripts/reuse-requirements.txt was compiled with
      - run: pip install --require-hashes -r scripts/reuse-requirements.txt
      - run: reuse lint

  # The dev scripts' own tests (D-088): in Python the stale sweep, the weekly report, the tracking
  # issues, the changelog and CITATION.cff scripts and the fixture generator; in bash ci.sh,
  # api_docs.sh and pr_checks.sh. They stub every tool they call: no toolchain, no network.
  scripts:
    name: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13" # the version the cloud sandbox and docs-build use
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: scripts/tests/test_ci.sh
      - run: scripts/tests/test_api_docs.sh
      - run: scripts/tests/test_pr_checks.sh

  # The bundles of the release targets (PRD 33 §2). The matrix runs on a Ready pull request, on one
  # labelled `ci:full`, and on `main`. When a Draft skips it, GitHub reports no build/<name> check,
  # so the checks PR-GIT-043 requires stay missing until the pull request is Ready. The bundles are
  # unsigned: tauri.unsigned.conf.json turns off the updater artifacts, whose signing key lives in
  # the `release` environment that only the release workflows use (PR-CI-007). The tests run on
  # one macOS target and on Windows; rust-test runs them on Linux.
  build:
    name: build/${{ matrix.name }}
    if: >-
      github.event_name != 'pull_request' || !github.event.pull_request.draft ||
      contains(github.event.pull_request.labels.*.name, 'ci:full')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, test: true }
          - { name: macos-x86_64, runner: macos-15, target: x86_64-apple-darwin, test: false }
          - { name: windows, runner: windows-2025, target: x86_64-pc-windows-msvc, test: true }
          - { name: linux-bundle, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, test: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: ./.github/actions/tauri-deps # zizmor: ignore[self-repository] actionlint rejects the $/ form
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-04
        with:
          targets: ${{ matrix.target }}
      # Only `main` saves these caches: four targets' release builds would crowd out the others
      # within the repository's 10 GB, and a pull request still restores the cache from `main`.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - if: matrix.test
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.150
      - if: matrix.test
        run: cargo nextest run --workspace
      # A path, not inline JSON: on Windows the `tauri` script runs under cmd.exe, which would
      # mangle the quotes. The path is relative to the repository root, where that script runs.
      - run: pnpm -C ui tauri build --target "$TARGET" --config src-tauri/tauri.unsigned.conf.json
      # The installers only, not the staging directories next to them (the AppImage's AppDir, the
      # unpacked .deb and .rpm trees, the .app that the .dmg already holds).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/*/*.deb
            target/${{ matrix.target }}/release/bundle/*/*.rpm
            target/${{ matrix.target }}/release/bundle/*/*.AppImage
            target/${{ matrix.target }}/release/bundle/*/*.dmg
            target/${{ matrix.target }}/release/bundle/*/*.msi

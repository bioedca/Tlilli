name: nightly

# The nightly checks of PRD 33 §1 on `main` (bootstrap task 22; docs/dev/scheduled-checks.md lists
# those still to come). The jobs that run code have a read-only token; only `report` writes, to the
# one tracking issue per job (PR-CI-014, scripts/tracking_issue.py).
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  workflow_dispatch:

# One run at a time (PR-CI-015, D-083): a run waits for the one before it, so no two reports touch
# an issue together. A newer pending run may replace an older pending one, which it makes redundant.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {} # each job declares the scopes it needs (PR-CI-003)

jobs:
  # A crash input is kept for 7 days; commit it as a regression test (PR-TST-013, fuzz/README.md).
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # the build, then ten minutes per target: add ten for each new target
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-04
        with:
          toolchain: nightly # cargo-fuzz needs it; `+nightly` overrides rust-toolchain.toml
      # No rust-cache: the nightly compiler changes daily, so each run would store a new cache.
      - run: cargo +nightly install cargo-fuzz@0.13.2 --locked
      - name: Run every target for ten minutes
        run: |
          targets=$(cargo +nightly fuzz list) # under bash -e, a failed listing fails the step
          [[ -n $targets ]] # and so does an empty one
          status=0
          for target in $targets; do
            cargo +nightly fuzz run "$target" -- -max_total_time=600 || status=1
          done
          exit "$status"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 7

  # The whole browser suite; pull requests run its @smoke subset in the `ui` job (PRD 34 §1).
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui exec playwright install --with-deps chromium
      - run: pnpm -C ui exec playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7

  # External links in the Markdown files (PR-DOC-019); the settings and allow-list are in lychee.toml.
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml './**/*.md'

  # The advisory database changes daily, so a green pull request can go red on `main` (PR-MNT-011).
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories

  # A new advisory and a fuzz crash are priority/P1 at once; broken links are a docs issue.
  report:
    needs: [fuzz, playwright, links, advisories]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          FUZZ: ${{ needs.fuzz.result }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
          LINKS: ${{ needs.links.result }}
          ADVISORIES: ${{ needs.advisories.result }}
        run: |
          status=0
          scripts/tracking_issue.py nightly/fuzz "$FUZZ" --p1 || status=1
          scripts/tracking_issue.py nightly/playwright "$PLAYWRIGHT" || status=1
          scripts/tracking_issue.py nightly/links "$LINKS" --area docs || status=1
          scripts/tracking_issue.py nightly/advisories "$ADVISORIES" --p1 || status=1
          exit "$status"

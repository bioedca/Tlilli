# cargo-fuzz targets (docs/prd/34-testing.md §1, PR-TST-013). This is a workspace of its own,
# excluded from the root workspace: libFuzzer links only under nightly with
# `-Zsanitizer=fuzzer`, and stable `cargo build --workspace` must never see it.
[package]
name = "tlilli-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
# The only path dependency that crosses a workspace boundary; cargo-fuzz requires this layout.
tlilli-core = { path = "../crates/tlilli-core" }

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
